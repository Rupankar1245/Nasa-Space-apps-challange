services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crewpulse
      POSTGRES_USER: crewpulse
      POSTGRES_PASSWORD: crewpulse
    ports:
      - "5432:5432"
    volumes:
      - crewpulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewpulse -d crewpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://crewpulse:crewpulse@db:5432/crewpulse
      JWT_SECRET: development-only-change-me
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  crewpulse-postgres:
